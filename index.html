<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store</title>
<style>
:root{--bg:#fff;--fg:#111;--line:#111;--muted:#777;--soon:#eee;--pad:56px}
body.dark{--bg:#121212;--fg:#eee;--line:#eee;--muted:#999;--soon:#2a2a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"DejaVu Sans",Verdana,sans-serif}
nav{display:flex;align-items:center;gap:24px;padding:10px 16px;border-bottom:3px solid var(--line);font-size:28px;position:sticky;top:0;background:var(--bg);z-index:5}
nav a{color:var(--fg);text-decoration:none;cursor:pointer}
nav .sp{flex:1}
#q{font:inherit;font-size:22px;width:280px;min-width:0;max-width:40vw;border:0;border-bottom:3px solid var(--line);background:transparent;color:var(--fg);outline:none}
#q::placeholder{color:var(--muted)}
button{background:none;border:0;color:var(--fg);font-size:26px;cursor:pointer;padding:0 4px}
h2{font-weight:400;font-size:34px;margin:22px 0 10px var(--pad)}
.row{display:flex;gap:46px;overflow-x:auto;padding:6px var(--pad) 16px;scrollbar-width:thin}
.p{flex:0 0 190px;height:296px;border:4px solid var(--line);padding:10px;font-family:"Comic Sans MS","Comic Neue",cursive;font-size:22px;color:inherit;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
a.p:hover,a.p:focus-visible{transform:translateY(-4px)}
.p.soon{background:var(--soon);color:var(--muted);cursor:not-allowed;border-style:dashed}
.p small{font-size:16px}
.tag{align-self:center;font-size:18px;font-weight:bold}
#none{display:none;margin:30px var(--pad);font-size:24px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:30px 16px}
@media(max-width:600px){:root{--pad:16px}nav{font-size:20px;gap:12px}h2{font-size:26px}.row{gap:16px}.p{flex-basis:140px;height:220px;font-size:18px}}
</style>
</head>
<body>
<nav>
  <a href="#" onclick="scrollTo(0,0);return false">Store</a>
  <a href="#" onclick="scrollTo(0,0);return false">Homepage</a>
  <span class="sp"></span>
  <input id="q" type="search" placeholder="Search here..." autocomplete="off" aria-label="search">
  <button id="go" title="search" aria-label="search">&#128269;</button>
  <button id="dm" title="dark mode" aria-label="toggle dark mode">&#9680;</button>
</nav>
<main id="rows"></main>
<div id="none">nothing found</div>
<footer>this website was generated by claude because i can't code for shit</footer>
<script>
const soon=t=>({t,soon:1});
const season=n=>soon("Season "+n);
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);

const data=[
 {name:"New Movies/Episodes",items:[
  {t:"The Simpsons Movie"},{t:"Shark Tale"},{t:"Family Guy S1",s:"family-guy-1-1"},{t:"Toy Story",s:"toy-story"},{t:"Ralph Breaks the Internet"}]},
 {name:"Family Guy",items:[{t:"Season 1",s:"family-guy-1-1"},...range(2,8).map(season)]},
 {name:"The Simpsons",items:[{t:"The Simpsons Movie"},...range(1,7).map(season)]},
 {name:"Toy Story",items:[{t:"Toy Story 1",s:"toy-story"},...range(2,5).map(n=>soon("Toy Story "+n))]},
 {name:"Funni's Picks",items:range(1,6).map(n=>soon("Pick #"+n))},
 {name:"Wreck-It Ralph",items:[{t:"Wreck-It Ralph"},{t:"Ralph Breaks the Internet"}]}
];

const rows=document.getElementById("rows");
const none=document.getElementById("none");
const q=document.getElementById("q");

data.forEach(r=>{
  const sec=document.createElement("section");
  sec.dataset.n=r.name.toLowerCase();
  const h=document.createElement("h2");
  h.textContent=r.name;
  const row=document.createElement("div");
  row.className="row";
  r.items.forEach(i=>{
    const e=document.createElement(i.soon?"div":"a");
    e.className="p"+(i.soon?" soon":"");
    e.dataset.t=i.t.toLowerCase();
    if(i.soon){e.setAttribute("aria-disabled","true")}
    else e.href="watch.html?v="+(i.s||slug(i.t));
    const label=document.createElement("span");
    label.append("poster",document.createElement("br"));
    const small=document.createElement("small");
    small.textContent=i.t;
    label.append(small);
    e.append(label);
    if(i.soon){
      const tag=document.createElement("span");
      tag.className="tag";tag.textContent="coming soon";
      e.append(tag);
    }
    row.append(e);
  });
  sec.append(h,row);
  rows.append(sec);
});

function filter(){
  const v=q.value.trim().toLowerCase();
  let shown=0;
  rows.querySelectorAll("section").forEach(s=>{
    let c=0;
    s.querySelectorAll(".p").forEach(p=>{
      const m=!v||p.dataset.t.includes(v)||s.dataset.n.includes(v);
      p.style.display=m?"":"none";
      if(m)c++;
    });
    s.style.display=c?"":"none";
    shown+=c;
  });
  none.style.display=shown?"none":"block";
}
q.addEventListener("input",filter);
q.addEventListener("keydown",e=>{if(e.key==="Escape"){q.value="";filter()}});
document.getElementById("go").onclick=()=>{filter();q.focus()};

const dm=document.getElementById("dm");
const store=(k,v)=>{try{v===undefined?0:localStorage.setItem(k,v);return localStorage.getItem(k)}catch(e){return null}};
const saved=store("dm");
if(saved==="1"||(saved===null&&matchMedia("(prefers-color-scheme: dark)").matches))document.body.classList.add("dark");
dm.onclick=()=>store("dm",document.body.classList.toggle("dark")?"1":"0");
</script>
</body>
</html>
