<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#888;--card:#fff;--line:#111;--soon:#eee}
[data-theme=dark]{--bg:#121212;--fg:#eee;--mut:#888;--card:#1c1c1c;--line:#eee;--soon:#2a2a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"DejaVu Sans",Verdana,sans-serif}
header{display:flex;align-items:center;gap:24px;padding:12px 18px;border-bottom:3px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header a{font-size:22px;color:var(--fg);text-decoration:none}
.sp{flex:1}
#q{border:0;border-bottom:2px solid var(--fg);background:transparent;color:var(--fg);font-size:18px;padding:4px;width:220px;outline:none}
#q::placeholder{color:var(--mut)}
button.ic{background:none;border:0;color:var(--fg);font-size:20px;cursor:pointer;padding:4px 8px}
section{padding:10px 24px 0}
h2{font-weight:400;font-size:26px;margin:14px 0 14px}
.row{display:flex;gap:24px;overflow-x:auto;padding-bottom:16px}
.p{color:inherit;text-decoration:none;flex:0 0 150px;height:210px;border:3px solid var(--line);background:var(--card);padding:10px;font-family:"Comic Sans MS",cursive;font-size:16px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .12s}
.p:hover{transform:translateY(-4px)}
.p small{font-family:inherit;font-size:12px;color:var(--mut)}
.p.soon{cursor:not-allowed;background:var(--soon);border-style:dashed}
.p.soon:hover{transform:none}
.p.soon small{font-weight:bold}
#none{display:none;padding:30px 24px;color:var(--mut)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10}
#modal div{background:var(--bg);border:3px solid var(--line);padding:30px 40px;text-align:center;font-size:20px}
#modal button{margin-top:16px;padding:6px 18px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<header>
  <a href="store.html">Store</a>
  <a href="#">Homepage</a>
  <a href="https://discord.gg/nYBCMNNQFE">Discord</a>
  <span class="sp"></span>
  <input id="q" placeholder="Search here..." autocomplete="off">
  <button class="ic" id="go" title="search">&#128269;</button>
  <button class="ic" id="theme" aria-label="toggle dark mode">&#9680;</button>
</header>
<main id="main"></main>
<div id="none">nothing found</div>
<div id="modal"><div><span id="mt"></span><br><button onclick="modal.style.display='none'">close</button></div></div>
<script>
const S=(n,t)=>({t,ok:false});
const O=t=>({t,ok:true});
const SL={"The Simpsons Movie":"the-simpsons-movie","Toy Story 1":"toy-story","Wreck-It Ralph":"wreck-it-ralph","Ralph Breaks the Internet":"ralph-breaks-the-internet","Family Guy S1E1":"family-guy-1-1","Shark Tale":"shark-tale","Family Guy Season 1":"family-guy-1-1"};
const X=t=>({t,ok:false});
const rows=[
 ["New Movies/Episodes",[O("The Simpsons Movie"),O("Toy Story 1"),O("Wreck-It Ralph"),O("Family Guy S1E1"),O("Shark Tale"),O("Ralph Breaks the Internet"),X("New Movie 1"),X("New Movie 2")]],
 ["Family Guy",[O("Family Guy Season 1"),...[2,3,4,5,6,7,8].map(n=>S(n,"Family Guy Season "+n))]],
 ["The Simpsons",[O("The Simpsons Movie"),...[1,2,3,4,5,6,7].map(n=>S(n,"The Simpsons Season "+n))]],
 ["Toy Story",[O("Toy Story 1"),...[2,3,4,5].map(n=>S(n,"Toy Story "+n))]],
 ["Funni's Picks",[O("Wreck-It Ralph"),O("Ralph Breaks the Internet"),O("Shark Tale"),...[4,5,6].map(n=>X("Funni's Pick "+n))]],
 ["Wreck-It Ralph",[O("Wreck-It Ralph"),O("Ralph Breaks the Internet")]]
];
const main=document.getElementById("main");
rows.forEach(([name,items])=>{
  const s=document.createElement("section");
  s.innerHTML=`<h2>${name}</h2><div class="row"></div>`;
  const r=s.querySelector(".row");
  items.forEach(i=>{
    const d=document.createElement(i.ok?"a":"div");
    d.className="p"+(i.ok?"":" soon");
    if(i.ok)d.href="movies/"+SL[i.t]+".html";
    d.dataset.t=i.t.toLowerCase();
    d.innerHTML=`<span>poster</span><small>${i.t}${i.ok?"":"<br>coming soon"}</small>`;
    r.appendChild(d);
  });
  main.appendChild(s);
});
const q=document.getElementById("q");
function search(){
  const v=q.value.trim().toLowerCase();let any=false;
  main.querySelectorAll("section").forEach(s=>{
    let n=0;
    s.querySelectorAll(".p").forEach(p=>{
      const m=!v||p.dataset.t.includes(v)||s.querySelector("h2").textContent.toLowerCase().includes(v);
      p.style.display=m?"":"none";if(m)n++;
    });
    s.style.display=n?"":"none";if(n)any=true;
  });
  document.getElementById("none").style.display=any?"none":"block";
}
q.addEventListener("input",search);
go.onclick=search;
q.addEventListener("keydown",e=>{if(e.key=="Enter")search()});
modal.onclick=e=>{if(e.target==modal)modal.style.display="none"};
const root=document.documentElement,tb=document.getElementById("theme");
function setT(t){root.dataset.theme=t}
setT(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
tb.onclick=()=>setT(root.dataset.theme=="dark"?"light":"dark");
</script>
</body>
</html>
